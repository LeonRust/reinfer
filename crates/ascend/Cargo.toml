[package]
name = "reinfer-ascend"
version = "0.1.0"
edition = "2024"

publish = false

[dependencies]
reinfer-core = { workspace = true }
reinfer-kernels = { workspace = true }
cann = { workspace = true }   # 经 [patch.crates-io] 本地桥接；无 ffi 默认桩可编译

[features]
# default = 昇腾能力开：跑 reinfer-ascend 即默认昇腾（用户 2026-08-27 定）。
# 本地/无 SDK 机编译本 crate 须显式 --no-default-features（桩模式；消除误用）；
# 真绑定开关 ascend = cann/ffi（对外唯一名；ffi 名退役）。
default = ["ascend"]
ascend = ["cann/ffi"]

[[example]]
name = "device_info"
required-features = ["ascend"]

[[example]]
name = "basic_ops"
required-features = ["ascend"]

[lints]
workspace = true
