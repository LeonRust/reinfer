[package]
name = "reinfer-ascend"
version = "0.1.0"
edition = "2024"

publish = false

[dependencies]
reinfer-core = { workspace = true }
reinfer-kernels = { workspace = true }
cann = { workspace = true }   # 经 [patch.crates-io] 本地桥接；无 ffi 默认桩可编译

[features]
# 目标机（NPU + CANN SDK）构建开关：本地开发机无 CANN，禁止开启。
ascend = ["cann/ffi"]   # 对外唯一开关（=cann/ffi 真绑定）；ffi 名退役（2026-08-27 用户定）

[[example]]
name = "device_info"
required-features = ["ascend"]

[[example]]
name = "basic_ops"
required-features = ["ascend"]

[lints]
workspace = true
