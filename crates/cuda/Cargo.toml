[package]
name = "reinfer-cuda"
version = "0.1.0"
edition = "2024"

publish = false

[dependencies]
reinfer-core = { workspace = true }
reinfer-kernels = { workspace = true }
reinfer-jit = { workspace = true }
cudarc = { workspace = true, optional = true }

[features]
default = ["cuda"]  # 跑 reinfer-cuda 即默认 CUDA；无 CUDA 工具链机器 build 本 crate 报错（不静默）
# from-build-system：按本机 CUDA toolkit 探测版本；未装 toolkit → 明确编译错误（不静默）
cuda = ["dep:cudarc", "cudarc/cuda-version-from-build-system"]

[[example]]
name = "device_info"
required-features = ["cuda"]

[[example]]
name = "basic_ops"
required-features = ["cuda"]

[[example]]
name = "kernel_probe"
required-features = ["cuda"]

[lints]
workspace = true

[dev-dependencies]
reinfer-gguf = { workspace = true }
serde_json = { workspace = true }
