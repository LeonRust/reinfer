[package]
name = "reinfer-cuda"
version = "0.1.0"
edition = "2024"

publish = false

[dependencies]
cudarc = { workspace = true, optional = true }

[features]
default = []
# from-build-system：按本机 CUDA toolkit 探测版本；未装 toolkit → 明确编译错误（不静默）
cuda = ["dep:cudarc", "cudarc/cuda-version-from-build-system"]

[lints]
workspace = true
